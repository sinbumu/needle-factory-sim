[project]
name = "needle-factory-sim"
version = "0.2.0"
description = "Edge AI PoC: Needle 2 local SLM tool-calling + Cloud LLM planning, validated by a deterministic FactoryController"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "cactus-needle",
    "PySide6",
    "pydantic>=2.7",
    "openai>=1.40",
    "anthropic>=1.5.0",
    "google-genai>=2.23.0",
]

[dependency-groups]
dev = [
    "pyinstaller>=6.22.2",
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/needle_factory_sim"]

[tool.pytest.ini_options]
testpaths = ["tests"]
